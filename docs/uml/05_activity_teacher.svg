<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1360" viewBox="0 0 1100 1360" font-family="DejaVu Sans, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="100%" height="100%" fill="#fff"/><text x="550.0" y="30" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">Activity Diagram - Teacher takes attendance</text>
<circle cx="520" cy="72" r="12" fill="#222"/>
<rect x="355.0" y="120" width="330" height="54" rx="16" fill="#EEF3F9" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="520" y="143.0" font-size="12" fill="#111" text-anchor="middle">Teacher enters email and password</text>
<text x="520" y="159.0" font-size="12" fill="#111" text-anchor="middle">and presses Login</text>
<polygon points="520,214 542,236 520,258 498,236" fill="#FFF6E0" stroke="#8A5A2F" stroke-width="1.5"/>
<text x="490" y="241" font-size="12" fill="#5a3a10" text-anchor="end" font-weight="bold">valid user?</text>
<rect x="355.0" y="308" width="330" height="38" rx="16" fill="#EEF3F9" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="520" y="331.0" font-size="12" fill="#111" text-anchor="middle">Choose one of his courses (JComboBox)</text>
<rect x="355.0" y="386" width="330" height="54" rx="16" fill="#EEF3F9" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="520" y="409.0" font-size="12" fill="#111" text-anchor="middle">Choose type: Lecture / Lab / Section</text>
<text x="520" y="425.0" font-size="12" fill="#111" text-anchor="middle">and write topic / experiment / group</text>
<rect x="330.0" y="480" width="380" height="54" rx="16" fill="#EEF3F9" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="520" y="503.0" font-size="12" fill="#111" text-anchor="middle">Press "Start Session"</text>
<text x="520" y="519.0" font-size="12" fill="#111" text-anchor="middle">(new LectureSession / LabSession / SectionSession)</text>
<polygon points="520,574 542,596 520,618 498,596" fill="#FFF6E0" stroke="#8A5A2F" stroke-width="1.5"/>
<rect x="355.0" y="658" width="330" height="54" rx="16" fill="#EEF3F9" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="520" y="681.0" font-size="12" fill="#111" text-anchor="middle">Student says his attendance ID</text>
<text x="520" y="697.0" font-size="12" fill="#111" text-anchor="middle">and the teacher types it (Enter)</text>
<polygon points="520,752 542,774 520,796 498,774" fill="#FFF6E0" stroke="#8A5A2F" stroke-width="1.5"/>
<text x="490" y="771" font-size="12" fill="#5a3a10" text-anchor="end" font-weight="bold">ID exists, enrolled in course</text>
<text x="490" y="787" font-size="12" fill="#5a3a10" text-anchor="end" font-weight="bold">and not marked before?</text>
<rect x="355.0" y="846" width="330" height="54" rx="16" fill="#EEF3F9" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="520" y="869.0" font-size="12" fill="#111" text-anchor="middle">Mark the student PRESENT</text>
<text x="520" y="885.0" font-size="12" fill="#111" text-anchor="middle">(AttendanceRecord, present = true)</text>
<polygon points="520,940 542,962 520,984 498,962" fill="#FFF6E0" stroke="#8A5A2F" stroke-width="1.5"/>
<text x="550" y="967" font-size="12" fill="#5a3a10" text-anchor="start" font-weight="bold">more students?</text>
<rect x="355.0" y="1034" width="330" height="38" rx="16" fill="#EEF3F9" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="520" y="1057.0" font-size="12" fill="#111" text-anchor="middle">Press "End Session"</text>
<rect x="355.0" y="1112" width="330" height="54" rx="16" fill="#EEF3F9" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="520" y="1135.0" font-size="12" fill="#111" text-anchor="middle">Every enrolled student not marked</text>
<text x="520" y="1151.0" font-size="12" fill="#111" text-anchor="middle">becomes ABSENT (session.close())</text>
<rect x="340.0" y="1206" width="360" height="54" rx="16" fill="#EEF3F9" stroke="#2F5D8A" stroke-width="1.5"/>
<text x="520" y="1229.0" font-size="12" fill="#111" text-anchor="middle">DataStore.save()  -&gt;  data/sessions.txt</text>
<text x="520" y="1245.0" font-size="12" fill="#111" text-anchor="middle">and show the session report</text>
